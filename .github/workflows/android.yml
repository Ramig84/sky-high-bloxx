name: Android build

# Builds the Sky Bloxx Android APK (testing) and AAB (Play Store upload).
# Runs on every push to main, or manually from the Actions tab.
# Signed AAB requires these repository secrets (Settings → Secrets → Actions):
#   ANDROID_KEYSTORE_BASE64   – base64 of your upload keystore (.jks/.keystore)
#   ANDROID_KEYSTORE_PASSWORD – keystore password
#   ANDROID_KEY_ALIAS         – key alias inside the keystore
#   ANDROID_KEY_PASSWORD      – key password
# Without those secrets the workflow still produces a debug APK for testing.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB (unsigned)
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/keystore.jks

      - name: Sign AAB
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          AAB=$(ls android/app/build/outputs/bundle/release/app-release.aab)
          jarsigner -keystore $RUNNER_TEMP/keystore.jks \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -keypass "${{ ANDROID_KEY_PASSWORD }}" \
            "$AAB" "${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: Upload APK (testing)
        uses: actions/upload-artifact@v4
        with:
          name: sky-bloxx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: sky-bloxx-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
