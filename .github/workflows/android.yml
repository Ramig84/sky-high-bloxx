name: Android build

# Builds the Sky Bloxx Android APK (testing) and AAB (Play Store upload).
# Runs on every push to main, or manually from the Actions tab.
#
# GitHub-only setup (no coding needed):
#   1. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        ANDROID_KEYSTORE_PASSWORD  (any password you choose)
#        ANDROID_KEY_PASSWORD       (same or another password you choose)
#   2. Actions → Android build → Run workflow.
#      The run creates your signing key and uploads an artifact named
#      "sky-bloxx-signing-key" containing sky-bloxx.jks and keystore-base64.txt.
#   3. Open keystore-base64.txt from that artifact, copy all of it, and save it
#      as a third secret: ANDROID_KEYSTORE_BASE64.
#   4. Run the workflow again — the AAB is now signed and Play Store ready.
#   5. KEEP the downloaded sky-bloxx.jks file safe forever (never lose it).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GRADLE_VERSION: "8.14.3"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packaged game content
        run: bun run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply painted game icon and splash artwork
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/test_android_artwork.py
          python scripts/test_package_android.py
          python scripts/android_artwork.py
          python scripts/package_android.py

      - name: Update Gradle wrapper
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version "$GRADLE_VERSION" --distribution-type bin
          ./gradlew --version

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version code from run number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease

      - name: Use saved signing key from secrets
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Create signing key and info file (first run only)
        if: ${{ env.KEYSTORE_B64 == '' }}
        run: |
          # Uses your saved passwords if present, otherwise makes strong random ones.
          SP="${KEYSTORE_PASSWORD:-$(openssl rand -hex 16)}"
          KP="${KEY_PASSWORD:-$SP}"
          ALIAS="${KEY_ALIAS:-skybloxx}"
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/sky-bloxx.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" -storepass "$SP" -keypass "$KP" \
            -dname "CN=Sky Bloxx, OU=Games, O=Sky Bloxx, C=QA"
          cp "$RUNNER_TEMP/sky-bloxx.jks" "$RUNNER_TEMP/keystore.jks"
          B64=$(base64 -w 0 "$RUNNER_TEMP/sky-bloxx.jks")
          echo "$B64" > "$RUNNER_TEMP/keystore-base64.txt"
          {
            echo "SKY BLOXX - ANDROID SIGNING INFO (KEEP SAFE FOREVER, NEVER SHARE)"
            echo ""
            echo "Add these 4 in GitHub: repo > Settings > Secrets and variables > Actions > New repository secret"
            echo "Copy each value exactly, with no spaces before or after."
            echo ""
            echo "1) Name: ANDROID_KEYSTORE_PASSWORD"
            echo "   Value: $SP"
            echo ""
            echo "2) Name: ANDROID_KEY_PASSWORD"
            echo "   Value: $KP"
            echo ""
            echo "3) Name: ANDROID_KEY_ALIAS"
            echo "   Value: $ALIAS"
            echo ""
            echo "4) Name: ANDROID_KEYSTORE_BASE64"
            echo "   Value (one long line below):"
            echo "$B64"
            echo ""
            echo "Also keep the file sky-bloxx.jks from this same download. Losing it means"
            echo "the app can never be updated on Google Play."
          } > "$RUNNER_TEMP/SIGNING-INFO.txt"
          echo "KEYSTORE_PASSWORD=$SP" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KP" >> "$GITHUB_ENV"
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Upload signing key backup (keep forever)
        if: ${{ env.SIGNING_READY == 'true' && env.KEYSTORE_B64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sky-bloxx-signing-key
          path: |
            ${{ runner.temp }}/SIGNING-INFO.txt
            ${{ runner.temp }}/sky-bloxx.jks
            ${{ runner.temp }}/keystore-base64.txt
          retention-days: 90

      - name: Sign AAB
        if: ${{ env.SIGNING_READY == 'true' }}
        run: |
          ALIAS="${KEY_ALIAS:-skybloxx}"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/keystore.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            android/app/build/outputs/bundle/release/app-release.aab "$ALIAS"
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK (testing)
        uses: actions/upload-artifact@v4
        with:
          name: sky-bloxx-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: sky-bloxx-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
